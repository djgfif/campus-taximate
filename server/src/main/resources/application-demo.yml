# MySQL 없이 돌려 보는 시연 설정이다. 재시작하면 데이터가 사라진다.
server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  flyway:
    enabled: false
    # demo,mysql로 켤 때 실행마다 비우기 위해 연다. 지우는 조건은 DemoDatabaseReset에 있다.
    clean-disabled: false
  datasource:
    url: jdbc:h2:mem:taximate;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  cookie-secure: false
  account-key: demo-only-account-key
  demo:
    enabled: true
  # 시연 계정을 자주 바꾸므로 인증 상한을 높인다.
  rate-limit:
    auth-per-minute: 300

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
