# MySQL 없이 돌려 보는 시연 설정이다. 재시작하면 데이터가 사라진다.
server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  flyway:
    enabled: false
    # demo,mysql로 켤 때 실행마다 비우기 위해 연다. 지우는 조건은 DemoDatabaseReset에 있다.
    clean-disabled: false
  datasource:
    url: jdbc:h2:mem:taximate;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  # 시연 학교. 시연 계정(demo-f1 등)과 시연 지점은 이 학교 주변 기준이다.
  schools:
    - name: 대진대학교
      email-domain: daejin.ac.kr
      gate-name: 학교 정문
      gate-spot: 정문 앞 버스 정류장
      lat: 37.875
      lon: 127.155
  payment:
    simulated: true
  cookie-secure: false
  account-key: demo-only-account-key
  demo:
    enabled: true
    # 시연 계정이 내릴 곳. 시연 학교 주변 실제 장소를 학교에서 가까운 순서로 4곳 이상 넣는다.
    dropoffs:
      - { name: 사거리 편의점 앞, lat: 37.8430, lon: 127.1500 }
      - { name: 시장 입구, lat: 37.8330, lon: 127.1460 }
      - { name: 주공아파트 앞 정류장, lat: 37.8240, lon: 127.1425 }
      - { name: 역전 버스 정류장, lat: 37.8150, lon: 127.1390 }
  # 시연 계정을 자주 바꾸므로 인증 상한을 높인다.
  # 노트북 한 대에서 여러 시연 계정·탭이 같은 IP로 채팅·상태를 폴링하므로 API 상한도 높인다.
  rate-limit:
    auth-per-minute: 300
    api-per-minute: 6000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
