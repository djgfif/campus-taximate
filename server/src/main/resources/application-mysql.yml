# 시연 모드를 실제 MySQL로 돌린다. SPRING_PROFILES_ACTIVE=demo,mysql 로 함께 켠다.
# DB 구조는 Flyway가 만들고 엔티티와 일치하는지 시작할 때 검사한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/taximate?serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:taximate}
    password: ${DB_PASSWORD:taximate}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
