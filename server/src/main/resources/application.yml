server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taximate?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:taximate}
    password: ${DB_PASSWORD:taximate}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  kakao:
    rest-key: ${KAKAO_REST_KEY:}
    base-url: https://apis-navi.kakaomobility.com
  mail-from: ${MAIL_FROM:noreply@taximate.local}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  upload-dir: ${UPLOAD_DIR:./uploads}
  demo:
    enabled: ${DEMO_ENABLED:false}
