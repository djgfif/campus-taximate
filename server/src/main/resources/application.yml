server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: ${COOKIE_SECURE:true}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taximate?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:taximate}
    password: ${DB_PASSWORD:taximate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: -1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  # 처음 띄울 때 만들 학교. 학교마다 학생 메일 도메인이 하나이고, 가입한 메일 도메인으로 학교가 정해진다.
  # 여러 학교를 넣으면 한 서버에서 학교별로 따로 매칭한다. 이미 학교가 있는 데이터베이스에는 다시 만들지 않는다.
  # 예)
  # schools:
  #   - name: 한빛대학교
  #     email-domain: hanbit.ac.kr
  #     gate-name: 정문
  #     gate-spot: 정문 앞 버스 정류장
  #     lat: 37.5
  #     lon: 127.0
  schools: []
  matching:
    join-payment-minutes: 5
    instant-match-minutes: 5
    instant-prep-minutes: 5
    instant-dispatch-minutes: 5
    instant-max-walk-seconds: 300
    # 0이면 마감 회차까지 모아서 확정(S42, 실험 C11: 매칭률 +2.5%p). 예전 규칙은 10.
    early-confirm-minutes: 0
  payment:
    timeout-ms: 3000
  # 확정 분담금(S43, 실험 C11). 견적 = 카카오 예상 요금 × (1 + quote-bias). 일행 확정 금액에는 여유분 quote-margin을 더한다.
  # quote-bias는 TIMS 2025 실제 영업요금이 요금표 견적보다 평균 6.57% 높았던 값이다. 여유분은 정산 적립금을 쌓는다.
  fare:
    quote-bias: ${FARE_QUOTE_BIAS:0.0657}
    quote-margin: ${FARE_QUOTE_MARGIN:0.01}
  features:
    sequential-pickup: false
  kakao:
    timeout-ms: 3000
    retries: 1
    rest-key: ${KAKAO_REST_KEY:}
    base-url: https://apis-navi.kakaomobility.com
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
  tmap:
    timeout-ms: 3000
    cache-minutes: 30
    daily-limit: 1000
    app-key: ${TMAP_APP_KEY:}
    base-url: https://apis.openapi.sk.com
  mail-from: ${MAIL_FROM:noreply@taximate.local}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:true}
  upload-dir: ${UPLOAD_DIR:./uploads}
  account-key: ${ACCOUNT_KEY:}
  demo:
    enabled: ${DEMO_ENABLED:false}
  push:
    public-key: ${PUSH_PUBLIC_KEY:}
    private-key: ${PUSH_PRIVATE_KEY:}
    subject: ${PUSH_SUBJECT:mailto:noreply@taximate.local}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 30
    api-per-minute: 600

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
