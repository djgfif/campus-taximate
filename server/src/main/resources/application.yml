server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: ${COOKIE_SECURE:true}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taximate?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:taximate}
    password: ${DB_PASSWORD:taximate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: -1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  matching:
    join-payment-minutes: 5
    instant-match-minutes: 5
    instant-prep-minutes: 5
    instant-dispatch-minutes: 5
    instant-max-walk-seconds: 300
  payment:
    timeout-ms: 3000
  features:
    sequential-pickup: false
  kakao:
    timeout-ms: 3000
    retries: 1
    rest-key: ${KAKAO_REST_KEY:}
    base-url: https://apis-navi.kakaomobility.com
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
  tmap:
    timeout-ms: 3000
    cache-minutes: 30
    daily-limit: 1000
    app-key: ${TMAP_APP_KEY:}
    base-url: https://apis.openapi.sk.com
  mail-from: ${MAIL_FROM:noreply@taximate.local}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:true}
  upload-dir: ${UPLOAD_DIR:./uploads}
  account-key: ${ACCOUNT_KEY:}
  demo:
    enabled: ${DEMO_ENABLED:false}
  push:
    public-key: ${PUSH_PUBLIC_KEY:}
    private-key: ${PUSH_PRIVATE_KEY:}
    subject: ${PUSH_SUBJECT:mailto:noreply@taximate.local}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 30
    api-per-minute: 600

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
