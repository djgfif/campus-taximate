app:
  # 기존 흐름 시험은 일행을 바로 만드는 예전 조기 확정(10분) 규칙으로 준비한다. 마감 대기 규칙은 엔진 시험(SpecAcceptanceTest s42…)과 MatchingDeadlineRuleTest가 본다.
  matching:
    early-confirm-minutes: 10
  # 기존 금액 시험은 견적 그대로(보정 0)로 본다. 보정 계수는 QuotedRouteClientTest에서 따로 시험한다.
  fare:
    quote-bias: 0
    quote-margin: 0
  # 시연 학교. 시연 계정(demo-f1 등)과 시연 지점은 이 학교 주변 기준이다.
  schools:
    - name: 대진대학교
      email-domain: daejin.ac.kr
      gate-name: 학교 정문
      gate-spot: 정문 앞 버스 정류장
      lat: 37.875
      lon: 127.155
  # 회귀 테스트에서는 환경의 외부 API 키를 사용하지 않는다.
  kakao:
    rest-key: ""
  tmap:
    app-key: ""
  toss:
    secret-key: ""
  rate-limit:
    enabled: false
